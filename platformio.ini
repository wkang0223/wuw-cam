[platformio]
; main.cpp lives in project root (not src/)
src_dir = .

[env:esp32cam]
platform    = espressif32@6.9.0
board       = esp32cam
framework   = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = huge_app.csv
upload_speed = 460800
upload_flags =
  --before=default_reset
  --after=hard_reset
  --no-stub
  --connect-attempts=10

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_RUNNING_CORE=1
  ; ── Survival mode for running off a USB-serial adapter's 3V3 pin (~50 mA).
  ; 80 MHz / 10 MHz XCLK / QVGA / 11 dBm / WiFi power-save / no MJPEG server.
  ; DELETE THIS LINE once a real 5V >=1A supply feeds the board's 5V pin.
  -DLOW_POWER_MODE

board_build.f_cpu = 240000000L

; Web stack is ESP-IDF's esp_http_server (built into the framework).
; AsyncTCP/ESPAsyncWebServer were removed: their handlers run on the TCP
; task, so blocking camera/SD work there starved the stack and the JPEG
; heap copy fragmented DRAM until the device reset.
lib_ignore = WebServer

; camtest.cpp / main_s3.cpp have their own setup()/loop() — keep them out
build_src_filter = +<*> -<.git/> -<camtest.cpp> -<main_s3.cpp> -<lcdtest.cpp> -<rendbench.cpp> -<rgbbench.cpp> -<pasar.cpp> -<WuwEventBridge.cpp> -<panel.cpp> -<link.cpp>

; ── Bare hardware diagnostic (no WiFi/web/recording) ──
; Flash with:  pio run -e camtest -t upload
[env:camtest]
extends = env:esp32cam
build_src_filter = +<camtest.cpp>

; ── ESP32-S3-WROOM CAM + OV5640 (Freenove pin map) ──
; Native USB: auto-reset works — no IO0 jumper needed, just plug in and
;   pio run -e esp32s3cam -t upload
[env:esp32s3cam]
platform  = espressif32@6.9.0
board     = wuwcam_s3_n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; N16R8: 16 MB quad flash + 8 MB OCTAL psram. The board was configured as 8 MB
; for its first year, which put the app in a 3.34 MB OTA slot and left half the
; flash unreachable. 16 MB gives 6.55 MB per slot and 3.5 MB of spiffs.
; CHANGING THIS NEEDS A FULL ERASE -- the partition table moves, so the old
; table's NVS lands inside the new app region and the device boots to garbage:
;   pio run -e wuwcam -t erase && pio run -e wuwcam -t upload
; Device name, station credentials, PASAR session and the panel
; flag all live in NVS and are wiped with it. Re-set them after the reflash.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  ; Warnings stay on. One -Wformat-truncation finding was worth the noise,
  ; and silence here is only meaningful if the flags are actually set.
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Wno-missing-field-initializers
  ; Serial stays on UART0 -> the CH343 "COM" port. Routing it to native USB
  ; (ARDUINO_USB_CDC_ON_BOOT=1 + ARDUINO_USB_MODE=1) was tried and stopped the
  ; firmware booting at all — the AP never came up. Not worth the convenience.
  -DCORE_DEBUG_LEVEL=0
lib_ignore = WebServer
build_src_filter = +<main_s3.cpp> +<video_writer.cpp> +<ui_art.cpp> -<pasar.cpp> -<WuwEventBridge.cpp> -<panel.cpp> -<link.cpp>

; ── Display bring-up + rendering benchmark (separate from the camera build) ──
; ST7789 + HR2046 on the seven free pins. Answers "custom renderer?" with
; measurements: path A (decode-all-then-push) vs path B (scaled block streaming).
;   pio run -e lcdtest -t upload
; ── Render pipeline benchmark — needs no display ──
;   pio run -e rendbench -t upload
[env:rendbench]
extends = env:esp32s3cam
build_src_filter = +<rendbench.cpp>
lib_deps = bitbank2/JPEGDEC@^1.6.1

; ── RGB565-direct vs JPEG-decode, head to head — needs no display ──
; Times capture / decode / effect / SPI push for both paths. The SPI stage
; clocks real DMA transfers out of the panel pins with nothing attached.
;   pio run -e rgbbench -t upload && pio device monitor
[env:rgbbench]
extends = env:esp32s3cam
build_src_filter = +<rgbbench.cpp>
lib_deps = bitbank2/JPEGDEC@^1.6.1

[env:lcdtest]
extends = env:esp32s3cam
build_src_filter = +<lcdtest.cpp>
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bitbank2/JPEGDEC@^1.6.1

; ── WUW-01 / PASAR PROTOCOL — the exhibition build ──
; Same source and the same UI art style as esp32s3cam; EXHIBITION_MODE gates
; the room/session/visitor layer, which lives in its own module. The standard
; env above is unaffected and still builds without any PASAR code.
;   pio run -e pasar -t upload
[env:pasar]
extends = env:esp32s3cam
build_flags =
  ${env:esp32s3cam.build_flags}
  -DEXHIBITION_MODE=1
  ; XEN-T1 event bridge. Drop this flag and every call compiles to nothing.
  -DWUW_EVENT_BRIDGE=1
  -DWUW_EVENT_PORT=4210
  ; WUW LINK: camera-to-camera discovery, synchronised shutter, frame pull.
  ; Listens, unlike the bridge -- see the threat model at the top of link.h.
  -DWUW_LINK=1
  -DWUW_LINK_PORT=4211
  ; Station credentials are NOT stored here. Join a network from the WIFI
  ; screen on the device (MORE > WIFI), or from the web page's WiFi section, and
  ; they persist in NVS. Keeping them out of this file keeps them out of git
  ; history, where a password cannot be taken back once committed.
build_src_filter = +<main_s3.cpp> +<video_writer.cpp> +<ui_art.cpp> +<pasar.cpp> +<WuwEventBridge.cpp> +<link.cpp> -<panel.cpp>

; ── WUW-01 merged: camera + web + PASAR + the panel OS in one binary ──
; The display is optional at runtime -- panelBegin() probes for it and the
; camera runs headless if none answers. This is the build that ships.
;   pio run -e wuwcam -t upload
; ── Bench variant: the panel is forced on before any network exists ──
; For diagnosing a screen whose ID register does not answer. The write path is
; independent of the read path -- a module with SDO unconnected drives a
; perfectly good picture and simply cannot be asked what it is.
;   pio run -e wuwcam-forcepanel -t upload
[env:wuwcam-forcepanel]
extends = env:wuwcam
build_flags =
  ${env:wuwcam.build_flags}
  -DPANEL_DEFAULT_MODE=1
  ; Loop the test pattern instead of handing over to the OS, so it can be
  ; watched and photographed rather than caught in a four-second window.
  -DPANEL_TEST_LOOP=1
  -DPANEL_SELFTEST=1
  ; Breadboard jumpers ring at 40 MHz. Override lower still if the comb smears.
  -DLCD_SPI_HZ=20000000

; ── Production-integrated calibrated touch paint test ──
; For raw controller diagnosis use the smaller touch_diag project, which is
; the measured source of truth and does not link camera/network production code.
;   pio run -e wuwcam-touch -t upload
[env:wuwcam-touch]
extends = env:wuwcam
build_flags =
  ${env:wuwcam.build_flags}
  -DPANEL_DEFAULT_MODE=1
  -DPANEL_SELFTEST=1
  -DPANEL_TOUCH_ONLY=1

[env:wuwcam]
extends = env:pasar
build_flags =
  ${env:pasar.build_flags}
  -DWUW_PANEL=1
build_src_filter = +<main_s3.cpp> +<video_writer.cpp> +<ui_art.cpp> +<pasar.cpp> +<WuwEventBridge.cpp> +<link.cpp> +<panel.cpp> +<bwo_game.cpp> +<wuw_gates.cpp> +<game_art.cpp>
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bitbank2/JPEGDEC@^1.6.1

; Same ESP32-S3 board and display OS, with frame allocation capped to the
; OV3660's native 3 MP limit. The camera pin map belongs to the S3 carrier and
; remains unchanged; the sensor driver is selected from its detected PID.
[env:wuwcam-ov3660]
extends = env:wuwcam
build_flags =
  ${env:wuwcam.build_flags}
  -DWUW_SENSOR_OV3660=1

; Third-unit recovery profile. Its newer S3 N16R8 package is not compatible
; with the external-RAM heap startup in Arduino 2 / ESP-IDF 4.4. Keep the two
; proven production profiles pinned above and use IDF 5 only for this unit.
[env:wuwcam-ov3660-idf5]
extends = env:wuwcam-ov3660
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = wuwcam_s3_n16_no_psram
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = disabled
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 115200
upload_flags =
  --before=default-reset
  --after=hard-reset
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Wno-missing-field-initializers
  -DCORE_DEBUG_LEVEL=0
  -DEXHIBITION_MODE=1
  -DWUW_EVENT_BRIDGE=1
  -DWUW_EVENT_PORT=4210
  -DWUW_LINK=1
  -DWUW_LINK_PORT=4211
  -DWUW_PANEL=1
  -DWUW_SENSOR_OV3660=1
  ; pioarduino 55.03.39 links esp_http_server but omits its public include
  ; directory from the generated S3 search path.
  -I/Users/Browny/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/esp_http_server/include
