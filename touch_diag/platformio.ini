[platformio]
src_dir = src

[env:touch-diag]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 115200
build_flags =
  ; This diagnostic must reach setup() even when external RAM is absent or
  ; defective. Keep PSRAM disabled and report through the CH343 UART port.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -Wall
  -Wextra

[env:screen-sweep]
extends = env:touch-diag
build_src_filter = +<screen_sweep.cpp> -<main.cpp>
lib_deps = lovyan03/LovyanGFX@^1.1.16

[env:screen-bitbang]
extends = env:touch-diag
build_src_filter = +<screen_bitbang.cpp> -<main.cpp>

[env:lcd-probe]
extends = env:touch-diag
build_src_filter = +<lcd_probe.cpp> -<main.cpp>
